version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: telegram-quiz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telegram-quiz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./src/backend/auth-service
      dockerfile: Dockerfile
    container_name: telegram-quiz-auth
    environment:
      - SPRING_PROFILES_ACTIVE=prod-vps
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET:-dGVsZWdyYW1xdWl6LWp3dC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC11c2Utb25seS0yMDI2}
      - FRONTEND_URL=http://localhost/tg-quiz
    volumes:
      - auth-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  main-service:
    build:
      context: ./src/backend/main-service
      dockerfile: Dockerfile
    container_name: telegram-quiz-main
    environment:
      - SPRING_PROFILES_ACTIVE=prod-vps
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      - DB_USERNAME=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-dGVsZWdyYW1xdWl6LWp3dC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC11c2Utb25seS0yMDI2}
      - BOT_TOKEN_ENCRYPTION_KEY=${BOT_TOKEN_ENCRYPTION_KEY:-ZGV2S2V5Rm9yVGVsZWdyYW1RdWl6QXBwMTIzNDU2Nzg=}
    volumes:
      - main-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: ./src/backend/api-gateway
      dockerfile: Dockerfile
    container_name: telegram-quiz-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod-vps
      - AUTH_SERVICE_URL=http://auth-service:8081
      - MAIN_SERVICE_URL=http://main-service:8082
    volumes:
      - gateway-logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - main-service
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: telegram-quiz-frontend
    environment:
      - API_GATEWAY_URL=http://api-gateway:8080
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  auth-logs:
  main-logs:
  gateway-logs:
