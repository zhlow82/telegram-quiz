server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # Base64-encoded secret: "telegramquiz-jwt-secret-key-for-development-use-only-2026"
  # IMPORTANT: Change this in production and store it as an environment variable
  secret: dGVsZWdyYW1xdWl6LWp3dC1zZWNyZXQta2V5LWZvci1kZXZlbG9wbWVudC11c2Utb25seS0yMDI2
  expiration: 900000        # 15 minutes in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds
