name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, main-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify ${{ matrix.service }}
        working-directory: src/backend/${{ matrix.service }}
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        working-directory: src/frontend
        run: npm ci

      - name: Unit tests
        working-directory: src/frontend
        run: npm run test:unit

      - name: Type check
        working-directory: src/frontend
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: src/frontend
        run: npm run build
